<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img" aria-label="Three small bodies orbiting a single shared core">
  <defs>
    <radialGradient id="tile-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fbf5ee"/>
      <stop offset="100%" stop-color="#f0dcc6"/>
    </radialGradient>
  </defs>
  <style>
    svg { color: #655649; }
    @media (prefers-color-scheme: dark) { svg { color: #A39080; } }
  </style>
  <rect width="200" height="120" fill="url(#tile-bg)"/>
  <circle cx="100" cy="60" r="34" stroke="#767676" stroke-width="1.5" stroke-dasharray="3, 5" fill="none"/>
  <circle cx="100" cy="60" r="7" fill="#b4a461"/>
  <circle cx="100" cy="60" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="100" y1="60" x2="100" y2="26" stroke="currentColor" stroke-width="2"/>
  <line x1="100" y1="60" x2="70" y2="80" stroke="currentColor" stroke-width="2"/>
  <line x1="100" y1="60" x2="130" y2="80" stroke="currentColor" stroke-width="2"/>
  <circle cx="100" cy="26" r="6" fill="currentColor"/>
  <circle cx="70" cy="80" r="6" fill="currentColor"/>
  <circle cx="130" cy="80" r="6" fill="currentColor"/>
</svg>
